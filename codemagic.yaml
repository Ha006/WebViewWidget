# Codemagic CI for Sökmotorn – unsigned IPA (no signing, no integrations).
workflows:
  ios-unsigned-ipa:
    name: iOS – unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events: []   # manual start only
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Sokmotorn.ipa Payload
    artifacts:
      - Sokmotorn.ipa
    publishing:
      email:
        recipients:
          - admin@klasholmgren.se
        notify:
          success: true
          failure: true
